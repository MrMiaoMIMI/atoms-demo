services:
  backend:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
      # 后加载的文件覆盖先加载的：线上 profile 覆盖共享 .env 中的环境相关值。
      - ./backend/.env.production
    environment:
      APP_ENV: production
      DATA_DIR: /app/data
      MAX_RUNNING_APPS: "2"
      GENERATED_APP_MEMORY_MB: "256"
    volumes:
      - ./backend/data:/app/data
    expose:
      - "8000"
    mem_limit: 1024m
    cpus: "1.0"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  web:
    build:
      context: .
      dockerfile: caddy/Dockerfile
    ports:
      - "80:80"
      - "443:443"
      # HTTP/3 (optional). Without inbound UDP 443 browsers fall back to HTTP/2.
      - "443:443/udp"
    environment:
      # Domain and ACME contact email. Override in a root .env file; Compose
      # loads it automatically. Caddy issues and renews the certificate.
      DOMAIN: ${DOMAIN:-hajimi.site}
      ACME_EMAIL: ${ACME_EMAIL:-admin@hajimi.site}
    volumes:
      # /data holds the ACME account and certificates. Keep this volume so a
      # container rebuild never re-issues (Let's Encrypt rate limits apply).
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
    mem_limit: 192m
    cpus: "0.5"
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
