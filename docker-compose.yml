services:
  backend:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    environment:
      DATA_DIR: /app/data
      MAX_RUNNING_APPS: "2"
      GENERATED_APP_MEMORY_MB: "256"
    volumes:
      - ./backend/data:/app/data
    expose:
      - "8000"
    mem_limit: 1024m
    cpus: "1.0"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  web:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend
    mem_limit: 192m
    cpus: "0.5"
    restart: unless-stopped
